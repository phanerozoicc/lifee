spring:
  application:
    name: lifee-config-app
  
  # 数据源配置
  datasource:
    url: jdbc:postgresql://localhost:5432/lifee_config
    username: ${DB_USERNAME:lifee}
    password: ${DB_PASSWORD:lifee123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      leak-detection-threshold: 60000
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false
  
  # Flyway数据库迁移
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  
  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 2
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms
  
  # Kafka配置
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 5
      buffer-memory: 33554432
    consumer:
      group-id: lifee-config-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.lifee.config.domain.events"

# 服务器配置
server:
  port: ${SERVER_PORT:8083}
  servlet:
    context-path: /config

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# 日志配置
logging:
  level:
    com.lifee.config: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 配置中心特定配置
lifee:
  config:
    # 缓存配置
    cache:
      enabled: true
      ttl: 300 # 5分钟
      max-size: 10000
    
    # 加密配置
    encryption:
      enabled: true
      algorithm: AES
      key-size: 256
    
    # 审计配置
    audit:
      enabled: true
      retention-days: 90
    
    # 备份配置
    backup:
      enabled: true
      schedule: "0 0 2 * * ?" # 每天凌晨2点
      retention-days: 30
    
    # 通知配置
    notification:
      enabled: true
      channels:
        - email
        - webhook
    
    # 权限配置
    security:
      enabled: true
      require-approval: true
      admin-roles:
        - ADMIN
        - CONFIG_ADMIN
      read-roles:
        - USER
        - CONFIG_USER
    
    # 环境配置
    environments:
      allowed:
        - development
        - testing
        - staging
        - production
      sensitive:
        - production
        - staging
    
    # 命名空间配置
    namespaces:
      default: "default"
      system: "system"
      reserved:
        - "system"
        - "internal"
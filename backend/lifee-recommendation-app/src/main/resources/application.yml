spring:
  application:
    name: lifee-recommendation
  
  datasource:
    url: jdbc:postgresql://localhost:5432/lifee_recommendation
    username: lifee
    password: lifee123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  
  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 2
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 1
      buffer-memory: 33554432
    consumer:
      group-id: lifee-recommendation-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.lifee.*"
    listener:
      ack-mode: manual_immediate

server:
  port: 8083
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    com.lifee: INFO
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/lifee-recommendation.log
    max-size: 100MB
    max-history: 30

# 推荐系统配置
recommendation:
  # 推荐算法配置
  algorithm:
    # 内容推荐权重
    content-based-weight: 0.3
    # 协同过滤权重
    collaborative-filtering-weight: 0.4
    # 热门推荐权重
    trending-weight: 0.2
    # 个性化推荐权重
    personalized-weight: 0.1
  
  # 推荐质量阈值
  quality:
    high-threshold: 0.8
    medium-threshold: 0.5
    low-threshold: 0.2
  
  # 推荐容量限制
  capacity:
    max-items-per-user: 100
    default-page-size: 20
    max-page-size: 50
  
  # 缓存配置
  cache:
    enabled: true
    ttl: 3600  # 1小时
    max-size: 10000